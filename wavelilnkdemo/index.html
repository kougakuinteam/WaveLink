<!doctype html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <title>Wavelink 语音通话 Demo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;margin:0;padding:16px;background:#0f172a;color:#e5e7eb}
    h1{font-size:20px;margin:0 0 12px}
    .card{background:#111827;border:1px solid #334155;border-radius:12px;padding:16px;margin-bottom:12px}
    label{display:block;margin:8px 0 4px}
    input,button,select{font-size:14px}
    input,select{padding:8px;border-radius:8px;border:1px solid #475569;background:#0b1220;color:#e5e7eb;width:280px}
    button{padding:8px 12px;border-radius:8px;border:1px solid #475569;background:#1f2937;color:#e5e7eb;margin-right:8px;cursor:pointer}
    button[disabled]{opacity:.5;cursor:not-allowed}
    .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
    .small{opacity:.7;font-size:12px}
    .log{white-space:pre-wrap;background:#0b1220;border-radius:8px;padding:8px;border:1px solid #334155;height:180px;overflow:auto}
    .peers{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
    .peer{border:1px dashed #334155;border-radius:10px;padding:10px}
    audio{width:100%}
  </style>
</head>
<body>
  <h1>Wavelink 语音通话 Demo</h1>
  <div class="card">
    <div class="row">
      <div>
        <label>房间号</label>
        <input id="roomInput" placeholder="例如: my-room-001" />
      </div>
      <div>
        <label>我的昵称（可选）</label>
        <input id="nameInput" placeholder="例如: 李哥" />
      </div>
      <div>
        <label>麦克风设备（可选）</label>
        <select id="micSelect"><option value="">默认麦克风</option></select>
      </div>
    </div>
    <div class="row" style="margin-top:8px">
      <button id="joinBtn">加入房间</button>
      <button id="leaveBtn" disabled>离开房间</button>
      <button id="muteBtn" disabled>静音</button>
      <span class="small">加入后会尝试拿麦；失败就自动“只听模式”。</span>
    </div>
  </div>
  <div class="card">
    <div class="row small">
      <div>连接日志（排查故障第一站）</div>
      <div id="selfMode" style="margin-left:auto">当前模式：未加入</div>
    </div>
    <div id="log" class="log"></div>
  </div>
  <div class="card">
    <div class="row small"><div>在线成员音频</div></div>
    <div id="peers" class="peers"></div>
  </div>
  <audio id="selfAudio" autoplay playsinline muted></audio>

<script>
// ===== FINAL VERSION CONFIGURATION =====
const ICE_SERVERS = [
  { urls: "stun:openrelay.metered.ca:80" },
  { urls: "turn:openrelay.metered.ca:80", username: "openrelayproject", credential: "openrelayproject" },
  { urls: "turn:openrelay.metered.ca:443", username: "openrelayproject", credential: "openrelayproject" }
];

// ===== DOM & STATE =====
const $ = (id) => document.getElementById(id);
const log = (...args) => {
  console.log(...args);
  const el = $("log");
  if (!el) return;
  const line = args.map(a => (typeof a === "object" ? JSON.stringify(a) : String(a))).join(" ");
  el.textContent += line + "\n";
  el.scrollTop = el.scrollHeight;
};
const state = {
  ws: null, roomId: null, clientId: null, name: null,
  localStream: null, joined: false, muted: false,
  peers: new Map(),
};
const wsQueue = [];

// ===== UI REFS =====
const joinBtn = $("joinBtn");
const leaveBtn = $("leaveBtn");
const muteBtn = $("muteBtn");
const roomInput = $("roomInput");
const nameInput = $("nameInput");
const micSelect = $("micSelect");
const peersBox = $("peers");
const selfAudio = $("selfAudio");

// ===== CORE LOGIC =====
function wsUrl() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  return `${proto}://${location.host}/ws`;
}

async function ensureLocalStream() {
  if (state.localStream) return;
  try {
    const deviceId = micSelect.value || undefined;
    const audioOpts = { echoCancellation: true, noiseSuppression: true, autoGainControl: true };
    if (deviceId) audioOpts.deviceId = { exact: deviceId };
    
    const stream = await navigator.mediaDevices.getUserMedia({ audio: audioOpts, video: false });
    state.localStream = stream;
    selfAudio.srcObject = stream;
    $("selfMode").textContent = '当前模式：正常（有麦克风）';
    log('[local] 成功获取麦克风');
  } catch (e) {
    state.localStream = null;
    $("selfMode").textContent = '当前模式：只听模式（没麦克风权限或设备）';
    log('[local] 获取麦克风失败，进入只听模式：', e.message);
  }
}

function connectWS() {
  if (state.ws && (state.ws.readyState === WebSocket.OPEN || state.ws.readyState === WebSocket.CONNECTING)) return;
  const url = wsUrl();
  log('[ws] 准备连接：', url);
  state.ws = new WebSocket(url);

  state.ws.onopen = () => {
    log('[ws] 已连接');
    while (wsQueue.length) state.ws.send(wsQueue.shift());
    if (state.roomId && !state.joined) {
      wsSend({ type: 'join', roomId: state.roomId, name: state.name });
    }
  };
  state.ws.onclose = () => { log('[ws] 已断开，1s后尝试重连'); setTimeout(connectWS, 1000); cleanupAll('WS 断开'); };
  state.ws.onerror = (e) => log('[ws] 出错：', e);
  state.ws.onmessage = onWSMessage;
}

function wsSend(obj) {
  const data = JSON.stringify(obj);
  if (state.ws?.readyState === WebSocket.OPEN) {
    state.ws.send(data);
  } else {
    wsQueue.push(data);
    log('[ws] 排队发送：', obj);
  }
}

async function onWSMessage(ev) {
  let msg;
  try { msg = JSON.parse(ev.data); } catch { return; }

  switch (msg.type) {
    case 'joined':
      state.clientId = msg.clientId;
      state.joined = true;
      joinBtn.disabled = true; leaveBtn.disabled = false; muteBtn.disabled = false; muteBtn.textContent = '静音';
      log(`[room] 已加入房间：${state.roomId}，我的ID：${state.clientId}`);
      for (const peerId of (msg.peers || [])) {
        await createPeer(peerId, true); // I am the new one, I will make offers
      }
      break;
    case 'peer-joined':
      if (msg.clientId === state.clientId) break;
      log(`[room] 新人加入：${msg.clientId}（我作为老成员只创建连接，等待对方的 offer）`);
      await createPeer(msg.clientId, false); // I am the old one, I wait for offer
      break;
    case 'peer-left':
      log(`[room] 成员离开：${msg.clientId}`);
      destroyPeer(msg.clientId);
      break;
    case 'offer':
      await handleOffer(msg.from, msg.sdp);
      break;
    case 'answer':
      await handleAnswer(msg.from, msg.sdp);
      break;
    case 'ice-candidate':
      await handleIceCandidate(msg.from, msg.candidate);
      break;
  }
}

async function createPeer(peerId, amIOfferer) {
  if (state.peers.has(peerId)) return;
  
  const pc = new RTCPeerConnection({
    iceServers: ICE_SERVERS,
    iceTransportPolicy: 'all' // Use 'all' for flexibility
  });
  state.peers.set(peerId, { pc, audioEl: null, box: null });

  pc.onicecandidate = (e) => {
    if (e.candidate) wsSend({ type: 'ice-candidate', to: peerId, candidate: e.candidate });
  };
  pc.oniceconnectionstatechange = () => log(`[webrtc] ${peerId} ice状态：`, pc.iceConnectionState);
  pc.onconnectionstatechange = () => log(`[webrtc] ${peerId} 连接状态：`, pc.connectionState);

  pc.ontrack = (ev) => {
    const peer = state.peers.get(peerId);
    if (!peer) return;
    if (!peer.audioEl) {
      const wrap = document.createElement('div');
      wrap.className = 'peer';
      wrap.innerHTML = `<div class="small">对端：${peerId}</div>`;
      const audio = document.createElement('audio');
      audio.autoplay = true; audio.playsInline = true;
      wrap.appendChild(audio);
      peersBox.appendChild(wrap);
      peer.audioEl = audio;
      peer.box = wrap;
    }
    peer.audioEl.srcObject = ev.streams[0];
  };

  if (state.localStream) {
    state.localStream.getTracks().forEach(track => pc.addTrack(track, state.localStream));
  } else {
    // Listen-only mode: still need to receive audio
    pc.addTransceiver('audio', { direction: 'recvonly' });
  }

  if (amIOfferer) {
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    wsSend({ type: 'offer', to: peerId, sdp: pc.localDescription });
  }
}

async function handleOffer(from, sdp) {
  const peer = state.peers.get(from);
  if (!peer) return;
  await peer.pc.setRemoteDescription(new RTCSessionDescription(sdp));
  const answer = await peer.pc.createAnswer();
  await peer.pc.setLocalDescription(answer);
  wsSend({ type: 'answer', to: from, sdp: peer.pc.localDescription });
}

async function handleAnswer(from, sdp) {
  const peer = state.peers.get(from);
  if (peer) await peer.pc.setRemoteDescription(new RTCSessionDescription(sdp));
}

async function handleIceCandidate(from, candidate) {
  const peer = state.peers.get(from);
  if (peer && candidate) {
    try {
      await peer.pc.addIceCandidate(candidate);
    } catch (e) {
      log('[webrtc] addIceCandidate 失败：', e.message);
    }
  }
}

function destroyPeer(peerId) {
  const peer = state.peers.get(peerId);
  if (!peer) return;
  try { peer.pc.close(); } catch {}
  if (peer.box) peer.box.remove();
  state.peers.delete(peerId);
}

function cleanupAll(reason = '') {
  log('[cleanup] 清理所有连接：', reason);
  for (const id of state.peers.keys()) destroyPeer(id);
  state.joined = false;
  joinBtn.disabled = false; leaveBtn.disabled = true; muteBtn.disabled = true;
  $("selfMode").textContent = '未加入';
  if (state.localStream) {
    state.localStream.getTracks().forEach(t => t.stop());
    state.localStream = null;
    selfAudio.srcObject = null;
  }
}

// ===== UI BINDINGS =====
joinBtn.onclick = async () => {
  state.roomId = roomInput.value.trim();
  state.name = nameInput.value.trim() || null;
  if (!state.roomId) { alert('请先填房间号'); return; }
  
  await ensureLocalStream();
  connectWS();
};

leaveBtn.onclick = () => {
  wsSend({ type: 'leave' });
  cleanupAll('手动离开');
  if (state.ws) state.ws.close();
};

muteBtn.onclick = () => {
  if (!state.localStream) return;
  state.muted = !state.muted;
  state.localStream.getAudioTracks()[0].enabled = !state.muted;
  muteBtn.textContent = state.muted ? '取消静音' : '静音';
};

(async function init() {
  await listMics();
})();

</script>
</body>
</html>
