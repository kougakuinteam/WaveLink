        body {
            font-family: 'Noto Sans JP', sans-serif;
            background: linear-gradient(135deg, #e0f2fe 0%, #f0f9ff 100%);
            height: 100vh;
            overflow: hidden;
        }

        /* カスタムスクロールバー */
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* 画面遷移アニメーション */
        .page {
            transition: opacity 0.3s ease-in-out, transform 0.3s ease-in-out;
            opacity: 0;
            pointer-events: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform: scale(0.95);
            display: none; /* 初期状態は非表示 */
        }

        .page.active {
            opacity: 1;
            pointer-events: auto;
            transform: scale(1);
            display: flex; /* Flexboxで表示 */
            flex-direction: column;
        }

        /* 波のアニメーション背景 (装飾) */
        .wave-bg {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 50%;

            background-repeat: no-repeat;
            background-position: bottom;
            background-size: cover;
            z-index: -1;
        }
    </style>
</head>

    <!-- JavaScript Logic -->
    <script>
        // 画面遷移関数
        function navigateTo(pageId) {
            // すべてのページを非表示
            document.querySelectorAll('.page').forEach(page => {
                page.classList.remove('active');
            });
            // 指定されたページを表示
            const target = document.getElementById(pageId);
            if (target) {
                target.classList.add('active');
            }
        }

        async function apiPost(url, body){
            const res = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body),
            });
            const data = await res.json().catch(()=>({}));
            if(!res.ok || !data.ok) throw new Error(data.error || 'request_failed');
            return data;
        }

        // ログイン処理
        async function handleLogin(event) {
            event.preventDefault();
            const form = event.target;
            const email = (form.querySelector('input[type="email"]')?.value || '').trim();
            const password = (form.querySelector('input[type="password"]')?.value || '').trim();
            if(!email || !password){ alert('メールとパスワードを入力してください'); return; }
            try{
                const data = await apiPost('/api/login', { mail: email, password });
                currentUserName = data.user?.name || email;
                currentUserMail = data.user?.mail || email;
                localStorage.setItem('wl_user_name', currentUserName);
                localStorage.setItem('wl_user_mail', currentUserMail);
                navigateTo('page-main');
            }catch(e){
                alert('ログインに失敗しました');
            }
        }


        // 新規登録処理
        async function handleSignup(event) {
            event.preventDefault();
            const form = event.target;
            const name = (form.querySelector('input[name="name"]')?.value || form.querySelector('input[type="text"]')?.value || '').trim();
            const email = (form.querySelector('input[type="email"]')?.value || '').trim();
            const password = (form.querySelector('input[type="password"]')?.value || '').trim();
            if(!name || !email || !password){ alert('必須項目を入力してください'); return; }
            try{
                await apiPost('/api/register', { mail: email, name, password });
                const data = await apiPost('/api/login', { mail: email, password });
                currentUserName = data.user?.name || name || email;
                currentUserMail = data.user?.mail || email;
                localStorage.setItem('wl_user_name', currentUserName);
                localStorage.setItem('wl_user_mail', currentUserMail);
                alert('登録が完了しました！');
                navigateTo('page-main');
            }catch(e){
                alert('登録に失敗しました');
            }
        }


        // プロフィール更新 (Mock)
        function handleProfileUpdate(event) {
            event.preventDefault();
            alert('プロフィールを更新しました。');
            navigateTo('page-main');
        }

        // ====== app state (demo) ======
        let currentRoomId = null;
        let currentUserName = (localStorage.getItem('wl_user_name') || localStorage.getItem('wl_user') || 'guest');
        let currentUserMail = (localStorage.getItem('wl_user_mail') || '');

        // ====== chat ws ======
        const chat = { ws: null };

        function wsUrl(){
            const proto = location.protocol === 'https:' ? 'wss' : 'ws';
            return `${proto}://${location.host}/ws`;
        }

        function ensureChatWS(){
            return new Promise((resolve, reject)=>{
                if(chat.ws && (chat.ws.readyState===WebSocket.OPEN || chat.ws.readyState===WebSocket.CONNECTING)){
                    if(chat.ws.readyState===WebSocket.OPEN) return resolve();
                    const timer = setInterval(()=>{
                        if(chat.ws.readyState===WebSocket.OPEN){ clearInterval(timer); resolve(); }
                        if(chat.ws.readyState===WebSocket.CLOSED){ clearInterval(timer); reject(new Error('ws closed')); }
                    }, 50);
                    return;
                }
                chat.ws = new WebSocket(wsUrl());
                chat.ws.onopen = ()=> resolve();
                chat.ws.onclose = ()=>{};
                chat.ws.onerror = ()=>{};
                chat.ws.onmessage = onChatWSMessage;
            });
        }

        function chatSend(obj){
            try{
                if(chat.ws && chat.ws.readyState===WebSocket.OPEN){
                    chat.ws.send(JSON.stringify(obj));
                }
            }catch(e){}
        }

        function clearMessageListUI(){
            const c = document.getElementById('chat-messages');
            if(c) c.innerHTML = '';
        }

        function appendMessageToUI(user, text, ts){
            const chatContainer = document.getElementById('chat-messages');
            if(!chatContainer) return;

            const now = ts ? new Date(ts) : new Date();
            const timeStr = now.getHours() + ':' + String(now.getMinutes()).padStart(2,'0');

            const isMine = (String(user||'') === String(currentUserName||''));

            const wrap = document.createElement('div');
            wrap.className = isMine ? 'flex justify-end' : 'flex justify-start';

            const bubble = document.createElement('div');
            bubble.className = (isMine ? 'bg-teal-600 text-white' : 'bg-white text-slate-700') + ' rounded-2xl px-4 py-2 max-w-[75%] shadow-sm';

            const meta = document.createElement('div');
            meta.className = 'text-[10px] opacity-70 mb-1';
            meta.textContent = `${user||'anon'} ・ ${timeStr}`;

            const body = document.createElement('div');
            body.className = 'text-sm whitespace-pre-wrap break-words';
            body.textContent = text;

            bubble.appendChild(meta);
            bubble.appendChild(body);
            wrap.appendChild(bubble);
            chatContainer.appendChild(wrap);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function onChatWSMessage(ev){
            let msg; try{ msg = JSON.parse(ev.data); }catch{ return; }

            if(msg.type === 'history-data'){
                if(msg.roomId !== currentRoomId) return;
                clearMessageListUI();
                (msg.items||[]).forEach(it=>{
                    appendMessageToUI(it.user, it.text, it.ts);
                });
                return;
            }

            if(msg.type === 'chat'){
                if(msg.roomId !== currentRoomId) return;
                const it = msg.item;
                if(!it) return;
                appendMessageToUI(it.user, it.text, it.ts);
                return;
            }
        }

        async function switchRoom(roomId){
            currentRoomId = roomId;
            const ridEl = document.getElementById('current-room-id');
            if(ridEl) ridEl.textContent = roomId || '-';

            await ensureChatWS();
            chatSend({ type:'join', roomId: roomId, mode:'chat', mail: currentUserMail });
            chatSend({ type:'history', roomId: roomId });
        }


        // チャット作成 (Mock)
        function createChat() {
            currentRoomId = Math.random().toString(36).substring(2, 10);
            const url = `${location.origin}${location.pathname}?room=${encodeURIComponent(currentRoomId)}`;

            if(navigator.clipboard && navigator.clipboard.writeText){
                navigator.clipboard.writeText(url).then(()=>{
                    alert("ルームを作成しました！リンクをコピーしました。");
                }).catch(()=>{
                    prompt("チャットルームを作成しました！このURLを共有してください:", url);
                });
            }else{
                prompt("チャットルームを作成しました！このURLを共有してください:", url);
            }

            switchRoom(currentRoomId);
            navigateTo('page-chat');
        }


        // チャット参加 (Mock)
        function extractRoomIdFromInput(input){
            if(!input)return "";
            input = String(input).trim();
            if(!input)return "";
            try{
                if(input.startsWith("http")){
                    const u = new URL(input);
                    return (u.searchParams.get("room") || (u.hash?u.hash.replace("#",""):"") || "").trim();
                }
            }catch(e){}
            return input;
        }

        function joinChat() {
            const el = document.getElementById('join-room-input');
            const raw = el ? el.value.trim() : "";
            if(!raw){
                alert("リンク（またはルームID）を入力してください");
                return;
            }
            const rid = extractRoomIdFromInput(raw);
            if(!rid){
                alert("リンクが正しくありません");
                return;
            }
            if(el) el.value = "";
            switchRoom(rid);
            navigateTo('page-chat');
        }

        // メッセージ送信処理
        function sendMessage(event) {
            event.preventDefault();
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if(!text) return;

            if(!currentRoomId){
                alert('ルームに参加してください');
                return;
            }

            chatSend({ type:'chat', roomId: currentRoomId, user: currentUserName, mail: currentUserMail || currentUserName, text });
            input.value = '';
        }

        //     const randomRes = responses[Math.floor(Math.random() * responses.length)];

        // XSS対策用エスケープ
        function escapeHtml(unsafe) {
            return unsafe
                 .replace(/&/g, "&amp;")
                 .replace(/</g, "&lt;")
                 .replace(/>/g, "&gt;")
                 .replace(/"/g, "&quot;")
                 .replace(/'/g, "&#039;");
        }

        // アニメーション用のCSS追加
        const style = document.createElement('style');
        style.innerHTML = `
            @keyframes fadeInUp {
                from { opacity: 0; transform: translateY(10px); }
                to { opacity: 1; transform: translateY(0); }
            }
            .animate-fade-in-up {
                animation: fadeInUp 0.3s ease-out forwards;
            }
        `;
        document.head.appendChild(style);


        // ==============================
        // 1対1 音声通話（WebRTC P2P + WS Signaling）
        // ==============================
        const VOICE_ICE_SERVERS = [
            { urls: 'stun:stun.l.google.com:19302' },
        ];

        const callUI = {
            modal: document.getElementById('call-modal'),
            status: document.getElementById('call-status'),
            room: document.getElementById('call-room'),
            mic: document.getElementById('call-mic-select'),
            joinBtn: document.getElementById('call-join-btn'),
            leaveBtn: document.getElementById('call-leave-btn'),
            muteBtn: document.getElementById('call-mute-btn'),
            peers: document.getElementById('call-peers'),
            log: document.getElementById('call-log'),
            selfAudio: document.getElementById('call-self-audio'),
        };

        const voice = {
            ws: null,
            roomId: null,
            clientId: null,
            joined: false,
            muted: false,
            localStream: null,
            peerId: null,
            pc: null,
            remoteSet: false,
            pendingCandidates: [],
            remoteAudioEl: null,
        };

        function vLog(...args){
            const line = args.map(a=>String(a)).join(' ');
            callUI.log.textContent += line + "\
";
            callUI.log.scrollTop = callUI.log.scrollHeight;
            console.log('[voice]', ...args);
        }
        function setCallStatus(t){
            callUI.status.textContent = t;
        }

        function wsVoiceUrl(){
            return (location.protocol==='https:'?'wss':'ws')+'://'+location.host+'/ws';
        }

        async function listCallMics(){
            try{
                const devices = await navigator.mediaDevices.enumerateDevices();
                const mics = devices.filter(d=>d.kind==='audioinput');
                callUI.mic.innerHTML = '<option value="">デフォルトマイク</option>' + mics.map(d=>`<option value="${d.deviceId}">${(d.label||('Mic '+d.deviceId.slice(-4))).replace(/</g,'&lt;')}</option>`).join('');
            }catch(e){
                callUI.mic.innerHTML = '<option value="">デフォルトマイク</option>';
                vLog('[device] mic list failed:', e.message);
            }
        }
        listCallMics();

        async function ensureVoiceLocalStream(){
            if(voice.localStream) return voice.localStream;
            const deviceId = callUI.mic.value || undefined;
            const constraints = deviceId ? {audio:{deviceId:{exact:deviceId}}, video:false} : {audio:true, video:false};
            try{
                const s = await navigator.mediaDevices.getUserMedia(constraints);
                voice.localStream = s;
                callUI.selfAudio.srcObject = s;
                setCallStatus('マイクOK（通話可能）');
                vLog('[local] got mic');
            }catch(e){
                voice.localStream = null;
                setCallStatus('聴くのみ（マイク権限なし）');
                vLog('[local] mic denied => listen only:', e.message);
            }
            return voice.localStream;
        }

        function openCallModal(){
            if(!currentRoomId){
                currentRoomId = prompt('ルームID（デモ）:', '')?.trim() || null;
            }
            callUI.room.textContent = currentRoomId || '-';
            callUI.modal.classList.remove('hidden');
        }
        function closeCallModal(){
            callUI.modal.classList.add('hidden');
        }

        async function connectVoiceWS(){
            if(voice.ws && (voice.ws.readyState===WebSocket.OPEN || voice.ws.readyState===WebSocket.CONNECTING)) return;
            voice.ws = new WebSocket(wsVoiceUrl());
            voice.ws.onopen = ()=> vLog('[ws] open');
            voice.ws.onclose = ()=>{ vLog('[ws] close'); cleanupVoice('ws close'); };
            voice.ws.onerror = (e)=> vLog('[ws] err', e?.message||e);
            voice.ws.onmessage = onVoiceWSMessage;
        }
        function voiceSend(obj){
            try{ if(voice.ws && voice.ws.readyState===WebSocket.OPEN) voice.ws.send(JSON.stringify(obj)); }catch(e){ vLog('[ws] send fail', e.message); }
        }

        function resetPeersUI(){
            callUI.peers.innerHTML = '<div class="text-sm text-slate-400">まだ相手がいません</div>';
            voice.remoteAudioEl = null;
        }

        async function createPC(peerId){
            voice.peerId = peerId;
            voice.pc = new RTCPeerConnection({ iceServers: VOICE_ICE_SERVERS });
            voice.remoteSet = false;
            voice.pendingCandidates = [];

            voice.pc.onicecandidate = (ev)=>{
                if(ev.candidate){
                    voiceSend({ type:'ice-candidate', to: peerId, candidate: ev.candidate });
                }
            };
            voice.pc.onconnectionstatechange = ()=> vLog('[webrtc] conn', voice.pc.connectionState);
            voice.pc.oniceconnectionstatechange = ()=> vLog('[webrtc] ice', voice.pc.iceConnectionState);
            voice.pc.ontrack = (ev)=>{
                if(!voice.remoteAudioEl){
                    callUI.peers.innerHTML = '';
                    const box = document.createElement('div');
                    box.className = 'bg-slate-50 border border-slate-200 rounded-xl p-3';
                    box.innerHTML = `<div class="text-xs font-bold text-slate-600 mb-2">相手（${peerId}）</div>`;
                    const audio = document.createElement('audio');
                    audio.autoplay = true;
                    audio.playsInline = true;
                    audio.className = 'w-full';
                    box.appendChild(audio);
                    callUI.peers.appendChild(box);
                    voice.remoteAudioEl = audio;
                }
                voice.remoteAudioEl.srcObject = ev.streams[0];
            };

            // local tracks (only once)
            if(voice.localStream){
                voice.localStream.getTracks().forEach(t=> voice.pc.addTrack(t, voice.localStream));
            }
        }

        async function doOffer(){
            const offer = await voice.pc.createOffer({ offerToReceiveAudio: true });
            await voice.pc.setLocalDescription(offer);
            voiceSend({ type:'offer', to: voice.peerId, sdp: voice.pc.localDescription });
        }

        async function onVoiceWSMessage(ev){
            let msg; try{ msg=JSON.parse(ev.data); }catch{ return; }
            switch(msg.type){
                case 'room-full': {
                    setCallStatus('通話不可：ルームが満員（2人まで）');
                    vLog('[room] full', msg.roomId, 'size=', msg.size);
                    cleanupVoice('room full');
                    break;
                }
                case 'voice-joined': {
                    voice.clientId = msg.clientId;
                    voice.joined = true;
                    callUI.joinBtn.disabled = true;
                    callUI.leaveBtn.disabled = false;
                    callUI.muteBtn.disabled = false;
                    callUI.muteBtn.textContent = 'ミュート';
                    setCallStatus('接続中… 相手を待っています');
                    vLog('[room] joined', voice.roomId, 'id=', voice.clientId);
                    // existingPeers: only 0 or 1
                    const peers = msg.existingPeers || [];
                    if(peers.length>0){
                        const peerId = peers[0];
                        await createPC(peerId);
                        setCallStatus('通話接続中…');
                        await doOffer();
                    }
                    break;
                }
                case 'voice-peer-joined': {
                    const peerId = msg.clientId;
                    if(peerId===voice.clientId) break;
                    vLog('[room] peer-joined', peerId);
                    setCallStatus('相手が入室：接続待ち');
                    // 老側：PC 作って offer を待つ
                    if(!voice.pc){
                        await createPC(peerId);
                    }
                    break;
                }
                case 'voice-peer-left': {
                    vLog('[room] peer-left', msg.clientId);
                    setCallStatus('相手が退出しました');
                    // keep myself in room; just reset pc
                    if(voice.pc){ try{ voice.pc.close(); }catch{} voice.pc=null; }
                    resetPeersUI();
                    break;
                }
                case 'offer': {
                    const { from, sdp } = msg;
                    if(!voice.pc) await createPC(from);
                    await voice.pc.setRemoteDescription(new RTCSessionDescription(sdp));
                    voice.remoteSet = true;
                    const answer = await voice.pc.createAnswer();
                    await voice.pc.setLocalDescription(answer);
                    voiceSend({ type:'answer', to: from, sdp: voice.pc.localDescription });
                    // flush
                    for(const c of voice.pendingCandidates){
                        try{ await voice.pc.addIceCandidate(c); }catch(e){ vLog('flush cand fail', e.message); }
                    }
                    voice.pendingCandidates = [];
                    setCallStatus('通話中');
                    break;
                }
                case 'answer': {
                    const { from, sdp } = msg;
                    if(!voice.pc) break;
                    await voice.pc.setRemoteDescription(new RTCSessionDescription(sdp));
                    voice.remoteSet = true;
                    for(const c of voice.pendingCandidates){
                        try{ await voice.pc.addIceCandidate(c); }catch(e){ vLog('flush cand fail', e.message); }
                    }
                    voice.pendingCandidates = [];
                    setCallStatus('通話中');
                    vLog('[webrtc] answer set from', from);
                    break;
                }
                case 'ice-candidate': {
                    const { from, candidate } = msg;
                    if(!voice.pc || !candidate) break;
                    if(!voice.remoteSet){
                        voice.pendingCandidates.push(candidate);
                    }else{
                        try{ await voice.pc.addIceCandidate(candidate); }catch(e){ vLog('[webrtc] addIceCandidate fail', e.message); }
                    }
                    break;
                }
                default: break;
            }
        }

        function cleanupVoice(reason=''){
            vLog('[cleanup]', reason);
            if(voice.pc){ try{ voice.pc.close(); }catch{} }
            voice.pc = null;
            voice.peerId = null;
            voice.remoteSet = false;
            voice.pendingCandidates = [];
            if(voice.ws){ try{ voice.ws.close(); }catch{} }
            voice.ws = null;
            voice.joined = false;
            callUI.joinBtn.disabled = false;
            callUI.leaveBtn.disabled = true;
            callUI.muteBtn.disabled = true;
            voice.muted = false;
            callUI.muteBtn.textContent = 'ミュート';
            resetPeersUI();
            if(voice.localStream){ try{ voice.localStream.getTracks().forEach(t=>t.stop()); }catch{} }
            voice.localStream = null;
            callUI.selfAudio.srcObject = null;
        }

        // buttons
        callUI.joinBtn.onclick = async ()=>{
            callUI.log.textContent = '';
            resetPeersUI();
            if(!currentRoomId){ alert('ルームIDがありません（デモ）'); return; }
            voice.roomId = currentRoomId;
            callUI.room.textContent = currentRoomId;
            setCallStatus('準備中…');
            await ensureVoiceLocalStream();
            await connectVoiceWS();
            voiceSend({ type:'voice-join', roomId: voice.roomId });
        };
        callUI.leaveBtn.onclick = ()=>{
            try{ if(voice.ws && voice.ws.readyState===WebSocket.OPEN) voiceSend({ type:'voice-leave', roomId: voice.roomId }); }catch{}
            cleanupVoice('leave');
            setCallStatus('未接続');
        };
        callUI.muteBtn.onclick = ()=>{
            if(!voice.localStream){ alert('聴くのみモードではミュートできません'); return; }
            voice.muted = !voice.muted;
            voice.localStream.getAudioTracks().forEach(t=> t.enabled = !voice.muted);
            callUI.muteBtn.textContent = voice.muted ? 'ミュート解除' : 'ミュート';
        };

        // expose for onclick
        window.openCallModal = openCallModal;
        window.closeCallModal = closeCallModal;
        // auto-join if URL has ?room=
        (function(){
            try{
                const rid = new URLSearchParams(location.search).get('room');
                if(rid){
                    switchRoom(rid);
                    navigateTo('page-chat');
                }
            }catch(e){}
        })();
</script>
