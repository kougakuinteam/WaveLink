    <style>
        body {
            font-family: 'Noto Sans JP', sans-serif;
            background: linear-gradient(135deg, #e0f2fe 0%, #f0f9ff 100%);
            height: 100vh;
            overflow: hidden;
        }

        /* カスタムスクロールバー */
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* 画面遷移アニメーション */
        .page {
            transition: opacity 0.3s ease-in-out, transform 0.3s ease-in-out;
            opacity: 0;
            pointer-events: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform: scale(0.95);
            display: none; /* 初期状態は非表示 */
        }

        .page.active {
            opacity: 1;
            pointer-events: auto;
            transform: scale(1);
            display: flex; /* Flexboxで表示 */
            flex-direction: column;
        }

        /* 波のアニメーション背景 (装飾) */

            bottom: 0;
            left: 0;

            background-position: bottom;
            background-size: cover;
            z-index: -1;
        }

</head>

    <script>
        // 画面遷移関数
        function navigateTo(pageId) {
            // すべてのページを非表示
            document.querySelectorAll('.page').forEach(page => {
                page.classList.remove('active');
            });
            // 指定されたページを表示
            const target = document.getElementById(pageId);
            if (target) {
                target.classList.add('active');
            }
        }

        // ログイン処理 (Mock)
        function handleLogin(event) {
            event.preventDefault();
            // ここにバックエンド処理が入る想定
            
            // ボタンにローディング状態などを入れるとより良い
            navigateTo('page-main');
        }

        // 新規登録処理 (Mock)
        function handleSignup(event) {
            event.preventDefault();
            alert('登録が完了しました！');
            navigateTo('page-main');
        }

        // プロフィール更新 (Mock)
        function handleProfileUpdate(event) {
            event.preventDefault();
            alert('プロフィールを更新しました。');
            navigateTo('page-main');
        }

        // チャット作成 (Mock)
        function createChat() {
            const url = "https://wavelink.app/room/" + Math.random().toString(36).substring(7);
            
            // クリップボードにコピー (簡易実装)
            // 実際はnavigator.clipboard.writeTextを使いますが、iframe環境によっては制限があるためpromptで代用する場合も
            prompt("チャットルームを作成しました！このURLを共有してください:", url);
            navigateTo('page-chat');
        }

        // チャット参加 (Mock)
        function joinChat() {
            navigateTo('page-chat');
        }

        // メッセージ送信処理
        function sendMessage(event) {
            event.preventDefault();
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            
            if (text) {
                const chatContainer = document.getElementById('chat-messages');
                
                // 現在時刻の取得
                const now = new Date();
                const timeStr = now.getHours() + ':' + String(now.getMinutes()).padStart(2, '0');

                // 送信メッセージのHTML生成
                const messageHtml = `
                <div class="flex items-end gap-2 justify-end animate-fade-in-up">
                    <div>
                        <div class="bg-blue-500 px-4 py-2 rounded-2xl rounded-br-none shadow-md shadow-blue-100 text-sm text-white max-w-[240px]">
                            ${escapeHtml(text)}
                        </div>
                        <span class="text-[10px] text-slate-300 mr-1 mt-1 block text-right">${timeStr}</span>
                    </div>
                </div>
                `;
                
                // 追加
                const div = document.createElement('div');
                div.innerHTML = messageHtml;
                chatContainer.appendChild(div.firstElementChild);
                
                // スクロールを一番下へ
                chatContainer.scrollTop = chatContainer.scrollHeight;
                
                // 入力欄クリア
                input.value = '';

                // 返信モック (2秒後)
                setTimeout(() => {
                    receiveMockMessage();
                }, 2000);
            }
        }

        // XSS対策用エスケープ
        function escapeHtml(unsafe) {
            return unsafe
                 .replace(/&/g, "&amp;")
                 .replace(/</g, "&lt;")
                 .replace(/>/g, "&gt;")
                 .replace(/"/g, "&quot;")
                 .replace(/'/g, "&#039;");
        }

        // アニメーション用のCSS追加
        const style = document.createElement('style');
        style.innerHTML = `
            @keyframes fadeInUp {
                from { opacity: 0; transform: translateY(10px); }
                to { opacity: 1; transform: translateY(0); }
            }
            .animate-fade-in-up {
                animation: fadeInUp 0.3s ease-out forwards;
            }
        `;
        document.head.appendChild(style);
